services:
  - type: web
    name: movie-flask
    env: python
    buildCommand: |
      pip install -r requirements.txt
      g++ -std=c++17 src/main.cpp -o src/program
      chmod +x src/program
      ls -l src/
      echo "Build complete!"
    startCommand: |
      export PYTHONPATH=src
      gunicorn server:app
      ls -R
      echo "Listing complete — should see src/server.py"
